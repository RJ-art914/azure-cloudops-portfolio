name: CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Terraform, Python and Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure

      - name: Initialize Terraform bootstrap
        working-directory: infrastructure/bootstrap
        run: terraform init -backend=false -input=false

      - name: Validate Terraform bootstrap
        working-directory: infrastructure/bootstrap
        run: terraform validate

      - name: Initialize Terraform demo
        working-directory: infrastructure/environments/demo
        run: terraform init -backend=false -input=false

      - name: Validate Terraform demo
        working-directory: infrastructure/environments/demo
        run: terraform validate

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/api/requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q app/api

      - name: Validate frontend JavaScript
        run: node --check app/frontend/app.js

      - name: Validate frontend configuration JSON
        run: python -m json.tool app/frontend/staticwebapp.config.json > /dev/null
